services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/famcan-riskassessment/backend:latest
    container_name: backend-RA
    restart: unless-stopped
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    env_file:
      - ./.env
    depends_on:
      - db
    networks:
      - famcan-network

  db:
    image: postgres:17
    container_name: db-RA
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 2G
        reservations:
          cpus: "0.2"
          memory: 512M
    networks:
      - famcan-network

  rdb:
    image: redis:8
    container_name: rdb-RA
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    volumes:
      - rdb-data:/data
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - famcan-network

volumes:
  db-data:
  rdb-data:

networks:
  famcan-network:
    external: true
    depends_on:
      - db
