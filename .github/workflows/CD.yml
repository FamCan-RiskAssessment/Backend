name: CD

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Write .env file
        run: |
          echo "${{ secrets.ENV }}" > .env

      - name: Write .pem files
        run: |
          echo "${{ secrets.PRIVATE_KEY }}" > ./internal/infrastructure/jwt/privateKey.pem
          echo "${{ secrets.PUBLIC_KEY }}" > ./internal/infrastructure/jwt/publicKey.pem

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: "famcan-riskassessment"
          password: ${{ secrets.PAT }}

      - name: Build and Push Docker Image
        run: |
          docker compose build
          docker compose push
